name: Deploy V2 Application (Manual - compta-ai-v2.web.app)

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Déployer le backend Cloud Run V2 (assocompta-backend-staging)'
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: 'Déployer le frontend Firebase Hosting V2 (https://compta-ai-v2.web.app)'
        required: false
        default: true
        type: boolean
      deploy_rules:
        description: 'Déployer les règles Firestore & Storage'
        required: false
        default: true
        type: boolean

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  BACKEND_SERVICE_NAME: assocompta-backend-staging
  REPO_NAME: assocompta-backend
  HOSTING_SITE_ID: compta-ai-v2
  TARGET_BRANCH: ameliorationv2

jobs:
  # 1. BUILD & DEPLOY BACKEND (Cloud Run - V2)
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    outputs:
      backend_url: ${{ steps.get-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Docker Auth'
        if: ${{ inputs.deploy_backend != false }}
        run: |-
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: 'Build Container'
        if: ${{ inputs.deploy_backend != false }}
        run: |-
          docker build -t europe-west1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$BACKEND_SERVICE_NAME:${{ github.sha }} ./backend

      - name: 'Push Container'
        if: ${{ inputs.deploy_backend != false }}
        run: |-
          docker push europe-west1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$BACKEND_SERVICE_NAME:${{ github.sha }}

      - id: 'deploy'
        name: 'Deploy to Cloud Run (V2)'
        if: ${{ inputs.deploy_backend != false }}
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.BACKEND_SERVICE_NAME }}'
          image: 'europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}'
          region: '${{ env.REGION }}'
          flags: '--allow-unauthenticated --timeout=600 --memory=1Gi'
          env_vars: |
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            VERTEX_LOCATION=global
            GOOGLE_CLOUD_LOCATION=global
            GEMINI_FLASH_MODEL=gemini-3.5-flash
            GEMINI_PRO_MODEL=gemini-3-pro-preview
            USE_VERTEX_AI=true
            GOOGLE_GENAI_USE_VERTEXAI=true

      - id: 'get-url'
        name: 'Get Service URL'
        run: |
          if [ "${{ steps.deploy.outputs.url }}" != "" ]; then
             echo "url=${{ steps.deploy.outputs.url }}" >> $GITHUB_OUTPUT
          else
             EXISTING_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
             echo "url=$EXISTING_URL" >> $GITHUB_OUTPUT
          fi

  # 2. BUILD & DEPLOY FRONTEND (Firebase Hosting Permanent Site: compta-ai-v2.web.app)
  deploy-frontend:
    needs: [deploy-backend]
    if: ${{ inputs.deploy_frontend != false }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure Firebase Hosting Site V2 Exists & Deploy Live
        run: |
          echo "Création / vérification du site Firebase Hosting permanent : ${{ env.HOSTING_SITE_ID }}..."
          firebase hosting:sites:create ${{ env.HOSTING_SITE_ID }} --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive || true
          echo "Déploiement de l'application V2 sur https://${{ env.HOSTING_SITE_ID }}.web.app ..."
          firebase deploy --only hosting:${{ env.HOSTING_SITE_ID }} --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive

  # 3. DEPLOY FIRESTORE & STORAGE RULES
  deploy-rules:
    if: ${{ inputs.deploy_rules != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy Firestore & Storage Rules
        run: |
          firebase deploy --only firestore:rules,firestore:indexes,storage --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive
