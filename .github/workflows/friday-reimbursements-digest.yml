name: Synthèse Hebdomadaire Remboursements (Désactivé — géré in-app)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-friday-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vérifier statut synthèse hebdomadaire
        run: |
          if [ -f "Script/send_friday_reimbursements_digest.mjs" ]; then
            node Script/send_friday_reimbursements_digest.mjs
          else
            echo "La synthèse hebdomadaire du vendredi est gérée côté application (checkAndSendFriday12hReimbursementDigest)."
          fi
